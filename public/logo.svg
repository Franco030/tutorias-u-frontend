<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="100%" height="100%">
  <defs>
    <!-- Light mode colors -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&amp;display=swap');
      .text-tutorias {
        font-family: 'Playfair Display', serif;
        font-size: 52px;
        font-weight: 700;
        fill: #3b6991; /* deep-space-blue-600 */
      }
      .text-u {
        font-family: 'Playfair Display', serif;
        font-size: 60px;
        font-weight: 700;
        font-style: italic;
        fill: #4a83b5; /* deep-space-blue-500 */
      }
      
      @media (prefers-color-scheme: dark) {
        .text-tutorias {
          fill: #f1f4f2; /* granite-50 */
        }
        .text-u {
          fill: #6e9cc4; /* deep-space-blue-400 */
        }
      }
    </style>
  </defs>
  <text x="10" y="60" class="text-tutorias">Tutorias</text>
  <text x="215" y="60" class="text-u">U</text>
</svg>
